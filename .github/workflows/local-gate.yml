name: Local Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: Long validation gate to run deliberately
        type: choice
        required: true
        default: full
        options:
          - full
          - full-diagnostic
          - ledger-diagnostic
          - reproducibility
          - acceptance-replacement
          - corpus
          - self-hosting

concurrency:
  group: merit-local-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-pr:
    name: Python 3.11 / Ubuntu / short PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run short canonical PR gate
        run: |
          python scripts/doctor.py
          python scripts/gate.py pr --durations 10

  windows-pr:
    name: Python 3.11 / Windows / short PR gate
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2-pr
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run short canonical PR gate
        shell: pwsh
        run: |
          .\scripts\activate-windows-dev.ps1 -Msys2Root "${{ steps.msys2-pr.outputs.msys2-location }}"
          .\.venv\Scripts\python.exe scripts\doctor.py
          .\.venv\Scripts\python.exe scripts\gate.py pr --durations 10

  linux-reproducibility:
    name: Python 3.11 / Ubuntu / public stage reproducibility v2
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'reproducibility'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run public compiler-stage reproducibility gate
        run: python scripts/gate.py reproducibility
      - name: Upload public-stage reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-stage-reproducibility-ubuntu
          path: .merit/gates/reproducibility/*.json
          if-no-files-found: warn

  windows-reproducibility:
    name: Python 3.11 / Windows / public stage reproducibility v2
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'reproducibility'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2-reproducibility
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run public compiler-stage reproducibility gate
        shell: pwsh
        run: |
          .\scripts\activate-windows-dev.ps1 -Msys2Root "${{ steps.msys2-reproducibility.outputs.msys2-location }}"
          .\.venv\Scripts\python.exe scripts\gate.py reproducibility
      - name: Upload public-stage reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-stage-reproducibility-windows
          path: .merit/gates/reproducibility/*.json
          if-no-files-found: warn

  linux-corpus:
    name: Python 3.11 / Ubuntu / Alpha 1 corpus convergence
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'corpus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run Alpha 1 corpus convergence gate
        run: python scripts/gate.py corpus
      - name: Upload corpus coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha1-corpus-coverage
          path: .merit/gates/corpus/*.json
          if-no-files-found: warn

  linux-acceptance-replacement:
    name: Python 3.11 / Ubuntu / M7 replacement acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'acceptance-replacement'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run M7 replacement acceptance gate
        run: python scripts/gate.py acceptance-replacement
      - name: Upload M7 acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-replacement-acceptance
          path: .merit/gates/acceptance-replacement/*.json
          if-no-files-found: warn

  linux-self-hosting:
    name: Python 3.11 / Ubuntu / SH5 self-hosting
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'self-hosting'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run SH5 self-hosting gate
        run: python scripts/gate.py self-hosting
      - name: Upload SH5 self-hosting report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sh5-self-hosting-ubuntu
          path: .merit/gates/self-hosting/result.json
          if-no-files-found: warn

  windows-self-hosting:
    name: Python 3.11 / Windows / SH5 self-hosting
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'self-hosting'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2-self-hosting
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run SH5 self-hosting gate
        shell: pwsh
        run: |
          .\scripts\activate-windows-dev.ps1 -Msys2Root "${{ steps.msys2-self-hosting.outputs.msys2-location }}"
          .\.venv\Scripts\python.exe scripts\gate.py self-hosting
      - name: Upload SH5 self-hosting report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sh5-self-hosting-windows
          path: .merit/gates/self-hosting/result.json
          if-no-files-found: warn

  linux-full-pytest:
    name: Python 3.11 / Ubuntu / ${{ inputs.gate == 'full' && 'full pytest' || 'focused diagnostic' }}
    if: github.event_name == 'workflow_dispatch' && (inputs.gate == 'full' || inputs.gate == 'full-diagnostic' || inputs.gate == 'ledger-diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore content-addressed native test objects
        uses: actions/cache@v4
        with:
          path: .merit/test-native-object-cache
          key: merit-native-objects-${{ runner.os }}-full-${{ hashFiles('merit/**/*.py', 'examples/projects/bootstrap_lexer/**/*.mrt', 'pyproject.toml') }}
          restore-keys: |
            merit-native-objects-${{ runner.os }}-full-
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run canonical full pytest phase
        if: inputs.gate == 'full'
        run: |
          python scripts/doctor.py --full
          python scripts/gate.py full-pytest --durations 50
      - name: Diagnose first full-suite failure
        if: inputs.gate == 'full-diagnostic'
        run: python -m pytest -q -x -n 2 --dist loadfile tests --ignore=tests/project/test_acceptance_replacement_migration.py --durations=10
      - name: Diagnose ledger shared-library ABI
        if: inputs.gate == 'ledger-diagnostic'
        run: python -m pytest -q -s tests/project/test_sh3_v4_corpus.py::test_sh3_v4_public_shared_build_preserves_ledger_decimal_abi

  windows-full-pytest:
    name: Python 3.11 / Windows / native full pytest
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'full'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Restore content-addressed native test objects
        uses: actions/cache@v4
        with:
          path: .merit/test-native-object-cache
          key: merit-native-objects-${{ runner.os }}-full-${{ hashFiles('merit/**/*.py', 'examples/projects/bootstrap_lexer/**/*.mrt', 'pyproject.toml') }}
          restore-keys: |
            merit-native-objects-${{ runner.os }}-full-
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run native Windows full pytest phase
        shell: pwsh
        run: .\scripts\test-windows.ps1 -Gate full-pytest -Durations 50 -Msys2Root "${{ steps.msys2.outputs.msys2-location }}"

  linux-full-acceptance:
    name: Python 3.11 / Ubuntu / full acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run canonical full acceptance phase
        run: |
          python scripts/doctor.py --full
          python scripts/gate.py full-acceptance

  windows-full-acceptance:
    name: Python 3.11 / Windows / native full acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'full'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run native Windows full acceptance phase
        shell: pwsh
        run: .\scripts\test-windows.ps1 -Gate full-acceptance -Msys2Root "${{ steps.msys2.outputs.msys2-location }}"

  linux-full:
    name: Python 3.11 / Ubuntu / full gate
    if: always() && github.event_name == 'workflow_dispatch' && inputs.gate == 'full'
    needs: [linux-full-pytest, linux-full-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require both canonical full phases
        run: |
          test "${{ needs['linux-full-pytest'].result }}" = success
          test "${{ needs['linux-full-acceptance'].result }}" = success

  windows-full:
    name: Python 3.11 / Windows / native full gate
    if: always() && github.event_name == 'workflow_dispatch' && inputs.gate == 'full'
    needs: [windows-full-pytest, windows-full-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require both canonical full phases
        run: |
          test "${{ needs['windows-full-pytest'].result }}" = success
          test "${{ needs['windows-full-acceptance'].result }}" = success
