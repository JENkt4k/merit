name: Local Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: merit-local-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-full:
    name: Python 3.11 / Ubuntu / full gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"

      - name: Run canonical full gate
        run: bash scripts/ci.sh --durations 50

  windows-full:
    name: Python 3.11 / Windows / native full gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Set up MSYS2 UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"

      - name: Run native Windows full gate
        shell: pwsh
        run: .\scripts\test-windows.ps1 -Gate full -Durations 50 -Msys2Root "${{ steps.msys2.outputs.msys2-location }}"
