name: Local Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: merit-local-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / Ubuntu / system C compiler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"

      - name: Run clean-environment gate
        run: bash scripts/ci.sh

  windows-native-smoke:
    name: Python 3.11 / Windows / MSYS2 UCRT64 GCC smoke
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up MSYS2 UCRT64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Install Merit and test dependencies
        shell: msys2 {0}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e ".[dev]"

      - name: Run Windows native build smoke tests
        shell: msys2 {0}
        env:
          CC: gcc
        run: |
          python -m pytest -vv \
            tests/project/test_native_build_portability.py \
            "tests/project/test_bootstrap_corpus_contract.py::test_manifest_source_case_matches_reference_interpreter_and_native[unterminated-string]"
