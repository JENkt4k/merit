name: Local Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: Long validation gate to run deliberately
        type: choice
        required: true
        default: full
        options:
          - full
          - reproducibility
          - acceptance-replacement
          - corpus

concurrency:
  group: merit-local-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux-pr:
    name: Python 3.11 / Ubuntu / short PR gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run short canonical PR gate
        run: |
          python scripts/doctor.py
          python scripts/gate.py pr --durations 10

  windows-pr:
    name: Python 3.11 / Windows / short PR gate
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2-pr
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run short canonical PR gate
        shell: pwsh
        run: |
          .\scripts\activate-windows-dev.ps1 -Msys2Root "${{ steps.msys2-pr.outputs.msys2-location }}"
          .\.venv\Scripts\python.exe scripts\doctor.py
          .\.venv\Scripts\python.exe scripts\gate.py pr --durations 10

  linux-reproducibility:
    name: Python 3.11 / Ubuntu / M9 stage reproducibility
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'reproducibility'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run M9 compiler-stage reproducibility gate
        run: python scripts/gate.py reproducibility
      - name: Upload M9 reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-reproducibility-ubuntu
          path: .merit/gates/reproducibility/*.json
          if-no-files-found: warn

  windows-reproducibility:
    name: Python 3.11 / Windows / M9 stage reproducibility
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'reproducibility'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2-reproducibility
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run M9 compiler-stage reproducibility gate
        shell: pwsh
        run: |
          .\scripts\activate-windows-dev.ps1 -Msys2Root "${{ steps.msys2-reproducibility.outputs.msys2-location }}"
          .\.venv\Scripts\python.exe scripts\gate.py reproducibility
      - name: Upload M9 reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-reproducibility-windows
          path: .merit/gates/reproducibility/*.json
          if-no-files-found: warn

  linux-corpus:
    name: Python 3.11 / Ubuntu / Alpha 1 corpus convergence
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'corpus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run Alpha 1 corpus convergence gate
        run: python scripts/gate.py corpus
      - name: Upload corpus coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha1-corpus-coverage
          path: .merit/gates/corpus/*.json
          if-no-files-found: warn

  linux-acceptance-replacement:
    name: Python 3.11 / Ubuntu / M7 replacement acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'acceptance-replacement'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run M7 replacement acceptance gate
        run: python scripts/gate.py acceptance-replacement
      - name: Upload M7 acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-replacement-acceptance
          path: .merit/gates/acceptance-replacement/*.json
          if-no-files-found: warn

  linux-full:
    name: Python 3.11 / Ubuntu / full gate
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore content-addressed native test objects
        uses: actions/cache@v4
        with:
          path: .merit/test-native-object-cache
          key: merit-native-objects-${{ runner.os }}-full-${{ hashFiles('merit/**/*.py', 'examples/projects/bootstrap_lexer/**/*.mrt', 'pyproject.toml') }}
          restore-keys: |
            merit-native-objects-${{ runner.os }}-full-
      - name: Install Merit and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Run canonical full gate
        run: bash scripts/ci.sh --durations 50

  windows-full:
    name: Python 3.11 / Windows / native full gate
    if: github.event_name == 'workflow_dispatch' && inputs.gate == 'full'
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Java benchmark runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up .NET benchmark runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Set up MSYS2 UCRT64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Restore content-addressed native test objects
        uses: actions/cache@v4
        with:
          path: .merit/test-native-object-cache
          key: merit-native-objects-${{ runner.os }}-full-${{ hashFiles('merit/**/*.py', 'examples/projects/bootstrap_lexer/**/*.mrt', 'pyproject.toml') }}
          restore-keys: |
            merit-native-objects-${{ runner.os }}-full-
      - name: Create Windows virtual environment and install Merit
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[dev]"
      - name: Run native Windows full gate
        shell: pwsh
        run: .\scripts\test-windows.ps1 -Gate full -Durations 50 -Msys2Root "${{ steps.msys2.outputs.msys2-location }}"
