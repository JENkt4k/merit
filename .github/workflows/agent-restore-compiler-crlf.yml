name: Agent restore compiler CRLF

on:
  push:
    branches:
      - agent/portable-monotonic-clock

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-monotonic-clock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore compiler CRLF
        run: python tools/restore_compiler_crlf.py
      - name: Commit line-ending repair
        run: |
          git config user.name "Merit Agent"
          git config user.email "actions@users.noreply.github.com"
          git add merit/compiler.py
          git commit -m "Restore compiler line endings [crlf-restored]"
          git push origin HEAD:agent/portable-monotonic-clock
