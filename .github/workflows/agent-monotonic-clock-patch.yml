name: Agent monotonic clock patch

on:
  push:
    branches:
      - agent/portable-monotonic-clock

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[clock-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-monotonic-clock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply compiler patch
        run: python tools/apply_monotonic_clock_patch.py
      - name: Commit compiler patch
        run: |
          git config user.name "Merit Agent"
          git config user.email "actions@users.noreply.github.com"
          git add merit/compiler.py
          git commit -m "Implement capability-aware monotonic clock [clock-patch-applied]"
          git push origin HEAD:agent/portable-monotonic-clock
